# CI — delegates to the fleet-canonical reusable workflow in jjuanrivvera/.github.
# Change fleet-wide CI policy there, not here. Only repo-specific inputs live below.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # A manual lever. On 2026-09-24 this repo stopped producing runs from push and
  # pull_request events entirely — the quirk recorded in the fleet AGENTS.md, seen before in
  # wootctl and remoteok — and without workflow_dispatch there was no way to verify ANY pull
  # request until the events came back. Editing this file through a PR is what revived the
  # other two; this keeps the fallback for next time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      coverage-threshold: "80"
      # Coverage comes largely from commands tests driving internal/api against a mock
      # Graph API, so the cross-package statements have to be credited.
      coverpkg: true
      run-gosec: true
      run-docs-check: true
      run-build: true

  gates:
    # The cliwright determinism gates are deliberately NOT part of the reusable workflow, so
    # they are wired here rather than re-inlined across the fleet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install the tools the gate scripts use
        # dod-check.sh greps with ripgrep and the installer is shellchecked; neither tool is
        # on the runner by default, and a missing tool makes every check using it "fail".
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep shellcheck
      - id: build
        run: make build
      - name: surface matches the manifest
        id: spec_check
        run: ./scripts/spec-check.sh
      - name: manifest still wraps the whole enumerated API
        id: spec_completeness
        if: ${{ !cancelled() }}
        run: ./scripts/spec-completeness.sh api-manifest.json 90
      - name: definition of done
        run: ./scripts/dod-check.sh waba
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: API gate summary
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CHECK_OUTCOME: ${{ steps.spec_check.outcome }}
          COMPLETENESS_OUTCOME: ${{ steps.spec_completeness.outcome }}
          CHECKED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo '## API gates'
            echo '| Gate | Outcome |'
            echo '| --- | --- |'
            printf '| Build | %s |\n' "$BUILD_OUTCOME"
            printf '| Surface consistency | %s |\n' "$CHECK_OUTCOME"
            printf '| Completeness | %s |\n' "$COMPLETENESS_OUTCOME"
            if [[ -f DECISIONS.md ]] && grep -Eiq 'coverage[ -]?waiver' DECISIONS.md; then
              echo 'Coverage waiver: registered in DECISIONS.md.'
            else
              echo 'Coverage waiver: none registered.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ! manifest=$(jq -er '
            select((.api_method_total | type == "number" and floor == . and . > 0)
              and (.api_method_source | type == "string" and length > 0)
              and (.resources | type == "array")
              and all(.resources[]; (.verbs | type == "array"))
              and ((.methods // []) | type == "array"))
            | [(((.resources // [] | map(.verbs // [] | length) | add) // 0)
                + (.methods // [] | length)), .api_method_total, .api_method_source]
            | @tsv' api-manifest.json); then
            echo 'API data unavailable or invalid: manifest missing or invalid.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! enumeration=$(jq -er '
            select((.operations | type == "array")
              and all(.operations[]; (.wrapped | type == "boolean")))
            | [.operations | length, ([.[] | select(.wrapped == true)] | length)] | @tsv
            ' specs/enumeration.json); then
            echo 'API data unavailable or invalid: enumeration missing or invalid.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          IFS=$'\t' read -r covered total source <<< "$manifest"
          IFS=$'\t' read -r enum_total enum_covered <<< "$enumeration"
          if [[ "$total" != "$enum_total" || "$covered" != "$enum_covered" ]]; then
            echo 'API data unavailable or invalid: manifest and enumeration counts differ.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '\nCompleteness: **%s/%s (%s%%)**; minimum: **90%%**.\n\n' \
            "$covered" "$total" "$((covered * 100 / total))" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: %s\n\n[Enumeration at checked SHA](https://github.com/%s/blob/%s/specs/enumeration.json)\n' \
            "$source" "$REPOSITORY" "$CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
