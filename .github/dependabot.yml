version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
