# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration.
#
# The generated command reference under docs/commands/*.md is produced by `make docs-gen`
# and verified by CI's drift check — it does not need AI review. It's also large: a single
# global flag change rewrites every command's doc, which alone can push a PR past CodeRabbit's
# per-PR file limit and cause the whole review to be skipped. Exclude it so the actual code
# still gets reviewed.
reviews:
  auto_review:
    # git-flow: every PR targets develop, and CodeRabbit only auto-reviews the default
    # branch unless the others are listed here — without this it silently skips every PR
    # with "reviews are disabled for this base branch". main stays covered implicitly.
    base_branches: ["^develop$"]
  path_filters:
    - "!docs/**"
